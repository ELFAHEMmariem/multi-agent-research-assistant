[project]
name = "multi-agent-research-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "groq>=0.11",
    "tavily-python>=0.5",
    "redis>=5.0",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "sse-starlette>=2.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "fakeredis>=2.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
